*{box-sizing:border-box}

button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 64px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:13px;color:#fff}
.brand i{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:2px}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
h1{font-size:clamp(30px,7.6vw,52px);line-height:1.06;margin:16px 0 0;letter-spacing:-.01em}
.dek{color:#c9c9d0;font-size:15.5px;line-height:1.75;margin:18px 0 0;max-width:34em}
.meta{display:flex;gap:34px;margin:26px 0 0}
.meta dt{font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:4px}
.meta dd{margin:0;font-size:26px;font-weight:800}
.btn{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;

  cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translateY(-2px)}
.btn--ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn--sm{margin-top:0;padding:13px 16px;font-size:14px;border-radius:11px}
.notices{margin:22px 0 0;display:grid;gap:9px}
.notices p{margin:0;font-size:12.6px;line-height:1.7;color:#a8a8b0}
.notices strong{color:#fff}
.field{width:100%;background:#141416;border:1px solid var(--line);border-radius:12px;padding:15px 16px;font-size:16px;outline:none}
.field:focus{border-color:#4a4a52}
.hint{font-size:12.5px;color:var(--dim);margin:9px 0 0}
.qtop{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim);letter-spacing:.1em}

.ghost{position:absolute;right:-6px;top:6px;font-size:clamp(72px,20vw,132px);font-weight:800;color:#131315;line-height:1;pointer-events:none;user-select:none}

.qtext b{color:var(--dim);font-weight:800;margin-right:6px}

.scale button .num{transition:color .15s ease}
.scale button .dot{transition:background .15s ease}
.scale button:hover{transform:translateY(-4px) scale(1.05);border-color:#fff;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.4)}

.scale button.sel .dot{background:#111}

/* ===== 社区1《思想验证区域》计分内核 =====
   官方计分在服务器端（bundle 无源码）。客户端可见契约（season-one-result 组件，
   bundle @283589-291500）：
     - 每条轴 = 一个字母 + 一个数字：L/R 政治、F/E 性别、W/U 阶级、O/C 开放性
     - 字母决定左右两端；数字 4 位档位(1..6)，且 = 该轴在左右轴上的位置
     - 强度 CS(d)= d<=3 ? 4-d : d-3，即结果为「左/右 + 1..3 级」
     - 颜色按 6 位档位取（L1..L3 / R4..R6 …）
   官方结果卡（主人提供的 13 张样本 OCR）显示的是「字母 + 1..3 级」+ TOTAL 合计：
     - 如 R2 F1 U3 O2，TOTAL = 四轴等级之和（4..12）
   即：卡片等级 = CS(档位)，TOTAL = 四轴等级之和。
*/

var S1_AXES = [
  { group: "politics", title: "政治", leftCode: "L", rightCode: "R", leftZh: "左派", rightZh: "右派", leftEn: "LEFT", rightEn: "RIGHT" },
  { group: "gender",   title: "性别", leftCode: "F", rightCode: "E", leftZh: "女性主义", rightZh: "平等主义", leftEn: "FEMINISM", rightEn: "EQUALISM" },
  { group: "class",    title: "阶级", leftCode: "W", rightCode: "U", leftZh: "劳动者", rightZh: "中上阶层", leftEn: "WORKING", rightEn: "UPPER MIDDLE" },
  { group: "openness", title: "开放性", leftCode: "O", rightCode: "C", leftZh: "开放", rightZh: "保守", leftEn: "OPEN MINDED", rightEn: "CONSERVATIVE" }
];

/* 官方配色：键 = 字母 + 6 位档位 */
var S1_COLORS = {
  L1: "#FF7719", L2: "#E38859", L3: "#B69687", R4: "#507C7E", R5: "#009095", R6: "#00A3AA",
  F1: "#FF000A", F2: "#CE333B", F3: "#8B5758", E4: "#426371", E5: "#006E9A", E6: "#007AC2",
  W1: "#D30000", W2: "#98000C", W3: "#5B2C2D", U4: "#27374B", U5: "#003B75", U6: "#003D9F",
  O1: "#FF3C43", O2: "#DB5D5F", O3: "#A27777", C4: "#8C9BA7", C5: "#72A0C3", C6: "#52A5DF"
};

function s1AxisMean(qs, answers) {
  var sum = 0, n = 0;
  for (var i = 0; i < qs.length; i++) {
    var q = qs[i], a = answers[q.id];
    if (a == null) continue;
    var t = (q.scale === 1) ? 0 : (a - 1) / (q.scale - 1); /* 0=该题最左 1=该题最右 */
    sum += q.reverse ? (1 - t) : t;   /* reverse=true: 同意即靠左 */
    n++;
  }
  if (!n) return 0.5;
  return sum / n;
}

/* mean(0=最左,1=最右) → 6 等分档位 1..6（官方客户端契约） */
function s1DigitFromMean(mean) {
  var m = Math.min(1, Math.max(0, mean));
  return Math.min(6, Math.floor(m * 6) + 1);
}

/* 6 位档位 → 1..3 级（官方 CS()） */
function s1Strength(digit) { return digit <= 3 ? 4 - digit : digit - 3; }

function s1ScoreAll(questions, answers) {
  var out = { axes: [] };
  for (var i = 0; i < S1_AXES.length; i++) {
    var ax = S1_AXES[i];
    var qs = questions.filter(function (q) { return q.group === ax.group; });
    var mean = s1AxisMean(qs, answers);
    var digit = s1DigitFromMean(mean);
    var left = digit <= 3;
    var letter = left ? ax.leftCode : ax.rightCode;
    var level = s1Strength(digit);            /* 1..3 级（官方卡片显示值） */
    out.axes.push({
      group: ax.group, title: ax.title,
      digit: digit,                            /* 1..6 官方档位 */
      level: level,                            /* 1..3 官方卡片等级 */
      token: letter + level,                   /* 卡片代码，如 R2 / L3 */
      token6: letter + digit,                  /* 6 位档位代码，如 R5 / L1 */
      side: left ? "left" : "right",
      label: left ? ax.leftZh : ax.rightZh,
      labelEn: left ? ax.leftEn : ax.rightEn,
      leftZh: ax.leftZh, rightZh: ax.rightZh, leftEn: ax.leftEn, rightEn: ax.rightEn,
      strength: level,
      color: S1_COLORS[letter + digit] || "#B2B2B2",
      mean: mean,
      leftPercent: Math.round((1 - mean) * 100),
      rightPercent: Math.round(mean * 100)
    });
  }
  out.code = out.axes.map(function (a) { return a.token; }).join("");       /* R2F1U3O2 */
  out.code6 = out.axes.map(function (a) { return a.token6; }).join("");     /* 官方 6 位档位串 */
  out.total = out.axes.reduce(function (s, a) { return s + a.level; }, 0);  /* 4..12 */
  out.byGroup = {};
  out.axes.forEach(function (a) { out.byGroup[a.group] = a; });
  return out;
}

      '<header class="qtop"><span class="brand"><i></i>思想验证区域</span>' +
      '<span>' + String(idx + 1).padStart(2, "0") + ' / ' + Q.length + '</span></header>' +
      '<div class="bar"><i style="width:' + ((idx + 1) / Q.length * 100) + '%"></i></div>' +
      '<main class="qbody">' +
        '<div class="qmeta"><span>QUESTION</span><span>键盘 1 — ' + q.scale + '</span></div>' +
        '<span class="ghost">' + String(idx + 1).padStart(2, "0") + '</span>' +
        '<h1 class="qtext"><b>Q.</b>' + esc(q.zh) + '</h1>' +
        '<div class="scale" id="sc">' +
          q.allowedAnswers.map(function (v, i) {
            return '<button data-v="' + v + '" class="' + (chosen === v ? "sel" : "") + '">' +
              '<span class="dot"></span><span class="num">' + v + '</span></button>';
          }).join("") +
        '</div>' +
        '<div class="tags">' + tags.map(function (t) { return '<span>' + (t || "&nbsp;") + '</span>'; }).join("") + '</div>' +
        (errMsg ? '<p class="err">' + esc(errMsg) + '</p>' : "") +
        (sending ? '<p class="sending">正在计算结果…</p>' : "") +
      '</main>' +
      '<div class="qfoot">' +
        '<button class="btn btn--ghost btn--sm" id="prev" ' + (idx === 0 || sending ? "disabled" : "") + ' style="flex:0 0 auto">← 上一题</button>' +
        '<button class="btn btn--sm" id="next" style="flex:1;justify-content:center" ' + (chosen == null || sending ? "disabled" : "") + '>下一题 ↘</button>' +
      '</div>';

    render(html);
    Array.prototype.forEach.call(document.querySelectorAll("#sc button"), function (b) {
      b.onclick = function () { pick(Number(b.getAttribute("data-v"))); };
    });
    document.getElementById("prev").onclick = prev;
    document.getElementById("next").onclick = function () { if (answers[q.id] != null) next(); };
  }

  function pick(v) {
    if (sending) return;
    var q = Q[idx];
    answers[q.id] = v;
    errMsg = "";
    var btns = document.querySelectorAll("#sc button");
    Array.prototype.forEach.call(btns, function (b) { b.classList.toggle("sel", Number(b.getAttribute("data-v")) === v); });
    var nx = document.getElementById("next");
    if (nx) nx.disabled = false;
    window.setTimeout(next, 190);
  }

  function next() {
    if (idx < Q.length - 1) { idx++; screenQuestion(); return; }
    finish();
  }

  function prev() { if (idx > 0) { idx--; screenQuestion(); } }

  /* ---------- 屏幕 4：结果 ---------- */
  function avatarSVG() {
    return '<svg class="avatar" viewBox="0 0 96 96" aria-hidden="true">' +
      '<defs><linearGradient id="avg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#141417"/></linearGradient></defs>' +
      '<rect x="0" y="0" width="96" height="96" rx="20" fill="url(#avg)"/>' +
      '<circle cx="48" cy="38" r="15" fill="#3d3d46"/>' +
      '<path d="M18 88c4-16 15-24 30-24s26 8 30 24z" fill="#3d3d46"/>' +
      '<rect x="0" y="0" width="96" height="96" rx="20" fill="none" stroke="#2b2b31"/>' +
    '</svg>';
  }

  function axisRow(a) {
    var on = function (side) { return a.side === side ? " side--on" : ""; };
    var onColor = a.side === "left" ? "left" : "right";
    var half = (a.level / 3) * 50;                 /* 半边长度的 1/3、2/3、满 */
    var barStyle = "width:" + half.toFixed(2) + "%;" + (a.side === "left" ? "right:50%" : "left:50%") + ";background:" + a.color;
    return '<li class="rcard__axis">' +
      '<div class="axrow">' +
        '<span class="side" style="' + (onColor === "left" ? "color:" + a.color : "") + '"><small>' + a.leftEn + '</small><b class="' + (onColor === "left" ? "on" : "") + '">' + a.leftZh + '</b></span>' +
        '<em class="axname">' + a.title + '</em>' +
        '<span class="side side--r" style="' + (onColor === "right" ? "color:" + a.color : "") + '"><small>' + a.rightEn + '</small><b class="' + (onColor === "right" ? "on" : "") + '">' + a.rightZh + '</b></span>' +
      '</div>' +
      '<div class="barwrap">' +
        '<i class="cbar" style="' + barStyle + '"><b>' + a.level + '</b></i>' +
        '<span class="centerline"></span>' +
      '</div>' +
      '<div class="brow">' +
        '<span class="bnum">' + a.leftPercent + '% <em style="font-style:normal;color:#8a8a93">' + a.leftZh + '</em></span>' +
        '<span class="bmid" style="color:' + a.color + '">' + a.token + '</span>' +
        '<span class="bnum">' + a.rightPercent + '% <em style="font-style:normal;color:#8a8a93">' + a.rightZh + '</em></span>' +
      '</div>' +
    '</li>';
  }

  function resultLines(res) {
    var now = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
    var ts = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
    var mk = function (a) {
      return a.label + " " + a.level + " 级（" + a.token + "；6 位档位 " + a.token6 + "，左 " + a.leftPercent + "% / 右 " + a.rightPercent + "%）";
    };
    return {
      "昵称": name || "未填写",
      "完成时间": ts,
      "结果代码": res.code,
      "TOTAL": String(res.total) + " / 12",
      "政治维度（左派↔右派）": mk(res.byGroup.politics),
      "性别维度（女性主义↔平等主义）": mk(res.byGroup.gender),
      "阶级维度（劳动者↔中上阶层）": mk(res.byGroup.class),
      "开放性维度（开放↔保守）": mk(res.byGroup.openness),
      "页面": "社区1 思想验证区域 中文版（surge）"
    };
  }

  function screenResult() {
    var res = s1ScoreAll(Q, answers);
    lastResult = res;
    render(
      '<header class="brand"><i></i>THE COMMUNITY</header>' +
      '<main style="flex:1">' +
        '<div class="card rcard">' +
          '<div class="rcard__top">' +
              '<div class="rcard__who">' +
              '<span class="rcard__name">' + (name ? esc(name) + " 的结果" : "你的结果") + '</span>' +
              '<strong class="rcard__code">' + res.code + '</strong>' +
              '<span class="rcard__sub">思想验证区域 · 四轴坐标</span>' +
            '</div>' +
          '</div>' +
          '<ol class="rcard__axes">' + res.axes.map(axisRow).join("") + '</ol>' +
          '<div class="rcard__total">' +
            '<span>TOTAL</span>' +
            '<strong>' + String(res.total).padStart(2, "0") + '</strong>' +
            '<em>/ 12</em>' +
          '</div>' +
        '</div>' +
        '<div class="notices">' + RESULT_NOTICES.map(function (t) { return "<p>" + t + "</p>"; }).join("") + '</div>' +
        '<section class="guide"><h2>各区域是如何测量的？</h2>' +
          GUIDE.map(function (g) { return '<details><summary>' + g.title + '</summary><p>' + g.body + '</p></details>'; }).join("") +
        '</section>' +
        '<div class="row"><button class="btn btn--ghost btn--sm" id="again">重新开始</button>' +
        '<button class="btn btn--sm" id="copy">复制结果</button></div>' +
        '<p class="foot">本页为民间中文复刻版，仅用于本地游玩；计分在本地完成，不会提交到官方服务器。<br>原版：Wavve 原创《思想验证区域：The Community》（thecommunity.co.kr/season/1）</p>' +
      '</main>'
    );
    document.getElementById("again").onclick = function () { idx = 0; answers = {}; screenIntro(); };
    document.getElementById("copy").onclick = function () {
      var txt = "我在《思想验证区域》中文版的结果：" + res.code + "（TOTAL " + res.total + "/12）—— " + res.axes.map(function (a) { return a.title + "：" + a.label + a.level + "级"; }).join("，");
      var done = document.getElementById("copy");
      var p = navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject();
      p.then(function () { done.textContent = "已复制 ✓"; }).catch(function () {
        try { window.prompt("复制以下文本：", txt); } catch (e) {}
      });
    };
  }

  function finish() {
    if (sending) return;
    sending = true;
    screenQuestion();
    window.setTimeout(function () { sending = false; screenResult(); }, 620);
  }

  /* 键盘：数字选档，← 上一题 */
  window.addEventListener("keydown", function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!document.getElementById("sc")) return;
    var q = Q[idx];
    if (e.key === "ArrowLeft") { e.preventDefault(); prev(); return; }
    var v = Number(e.key);
    if (v >= 1 && v <= q.scale) { e.preventDefault(); pick(v); }
  });

  screenIntro();
})();
</script>
</body>
</html>
